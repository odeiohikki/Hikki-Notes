name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'app.js'
      - 'style.css'
      - 'index.html'
      - 'sw.js'
      - 'zip.js'
      - 'manifest.json'
      - 'icon-*.png'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android project
        working-directory: native
        run: |
          npm install
          mkdir -p www
          cp ../index.html ../app.js ../style.css ../zip.js ../manifest.json ../sw.js ../icon-192.png ../icon-512.png www/
          npx cap add android
          npx cap sync android
          node --check www/app.js
          node --check www/sw.js
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('</manifest>', '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>')
          p.write_text(s)
          PY
      - name: Build debug APK
        working-directory: native/android
        run: bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hikki-Notes-Android-test
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
