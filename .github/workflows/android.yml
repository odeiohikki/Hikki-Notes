name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - 'app.js'
      - 'style.css'
      - 'index.html'
      - 'sw.js'
      - 'zip.js'
      - 'manifest.json'
      - 'icon-*.png'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android project
        working-directory: native
        run: |
          npm install
          python -m pip install Pillow
          mkdir -p www
          cp ../index.html ../app.js ../style.css ../zip.js ../manifest.json ../sw.js ../icon-192.png ../icon-512.png www/
          npx cap add android
          npx cap sync android
          node --check www/app.js
          node --check www/sw.js
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('</manifest>', '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n</manifest>')
          p.write_text(s)
          # Keep the WebView inside system bars, including Android 15.
          activity = Path('android/app/src/main/java/studio/hikki/notes/MainActivity.java')
          activity.write_text("""package studio.hikki.notes;
          import android.os.Bundle;
          import android.view.View;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.graphics.Insets;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle state) {
              registerPlugin(BackupPlugin.class);
              super.onCreate(state);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              View root = findViewById(android.R.id.content);
              ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                Insets bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout());
                Insets ime = insets.getInsets(WindowInsetsCompat.Type.ime());
                v.setPadding(bars.left, bars.top, bars.right, Math.max(bars.bottom, ime.bottom));
                return WindowInsetsCompat.CONSUMED;
              });
              getWindow().setStatusBarColor(0xff101e23);
              getWindow().setNavigationBarColor(0xff101e23);
              WindowCompat.getInsetsController(getWindow(), root).setAppearanceLightStatusBars(false);
              WindowCompat.getInsetsController(getWindow(), root).setAppearanceLightNavigationBars(false);
              ViewCompat.requestApplyInsets(root);
            }
          }
          """)
          activity.with_name('BackupPlugin.java').write_text("""package studio.hikki.notes;
          import android.app.Activity;
          import android.content.Intent;
          import androidx.activity.result.ActivityResult;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.ActivityCallback;
          import java.io.OutputStream;
          import android.util.Base64;
          @CapacitorPlugin(name="HikkiBackup")
          public class BackupPlugin extends Plugin {
            @PluginMethod public void save(PluginCall call) {
              try {
                byte[] bytes = Base64.decode(call.getString("data"), Base64.DEFAULT);
                if (bytes.length < 22 || bytes[0] != 80 || bytes[1] != 75) throw new java.io.IOException("ZIP vazio ou inválido");
                java.io.File temp = new java.io.File(getContext().getCacheDir(), "pending-backup.zip");
                try (java.io.FileOutputStream out = new java.io.FileOutputStream(temp)) { out.write(bytes); }
              } catch (Exception e) { call.reject("Falha ao preparar ZIP", e); return; }
              Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
              intent.addCategory(Intent.CATEGORY_OPENABLE);
              intent.setType("application/zip");
              intent.putExtra(Intent.EXTRA_TITLE, call.getString("name", "hikki-backup.zip"));
              startActivityForResult(call, intent, "saved");
            }
            @ActivityCallback private void saved(PluginCall call, ActivityResult result) {
              if (call == null) return;
              if (result.getResultCode() != Activity.RESULT_OK || result.getData() == null || result.getData().getData() == null) {
                call.reject("Exportação cancelada");
                return;
              }
              try (OutputStream out = getContext().getContentResolver().openOutputStream(result.getData().getData(), "w")) {
                if (out == null) throw new java.io.IOException("Arquivo indisponível");
                java.io.File temp = new java.io.File(getContext().getCacheDir(), "pending-backup.zip");
                if (temp.length() < 22) throw new java.io.IOException("ZIP temporário vazio");
                try (java.io.InputStream in = new java.io.FileInputStream(temp)) {
                  byte[] buffer = new byte[65536]; int n;
                  while ((n = in.read(buffer)) != -1) out.write(buffer, 0, n);
                }
                out.flush();
              } catch (Exception e) { call.reject("Não foi possível salvar o backup", e); return; }
              try {
                java.io.File temp = new java.io.File(getContext().getCacheDir(), "pending-backup.zip");
                long count = 0;
                try (java.io.InputStream in = getContext().getContentResolver().openInputStream(result.getData().getData())) {
                  if (in == null) throw new java.io.IOException("Não foi possível verificar o arquivo");
                  byte[] buffer = new byte[65536]; int n;
                  while ((n = in.read(buffer)) != -1) count += n;
                }
                if (count < 22 || count != temp.length()) throw new java.io.IOException("Arquivo incompleto: " + count + " bytes");
                com.getcapacitor.JSObject info = new com.getcapacitor.JSObject();
                info.put("bytes", count);
                temp.delete();
                call.resolve(info);
              } catch (Exception e) { call.reject("Backup não confirmado", e); }
            }
          }
          """)
          # Use the existing Hikki Notes artwork for the launcher.
          from PIL import Image
          source = Image.open('../icon-512.png').convert('RGBA')
          res = Path('android/app/src/main/res')
          for folder in res.glob('mipmap-*'):
              for name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  target = folder / name
                  if target.exists():
                      size = Image.open(target).size
                      icon = source.resize(size, Image.Resampling.LANCZOS)
                      if 'foreground' in name:
                          icon = Image.new('RGBA', size)
                          scaled = source.resize(tuple(round(n * .68) for n in size), Image.Resampling.LANCZOS)
                          icon.paste(scaled, tuple((n-m)//2 for n,m in zip(size,scaled.size)))
                      icon.save(target)
          (res / 'values' / 'hikki_icon.xml').write_text('<resources><color name="hikki_icon_background">#28563D</color></resources>')
          for target in res.glob('mipmap-anydpi*/ic_launcher*.xml'):
              t = target.read_text()
              import re
              t = re.sub(r'android:drawable="@[^"]*ic_launcher_background"', 'android:drawable="@color/hikki_icon_background"', t)
              target.write_text(t)
          PY
      - name: Configure optional permanent signing
        env:
          HIKKI_KEYSTORE_BASE64: ${{ secrets.HIKKI_KEYSTORE_BASE64 }}
          HIKKI_KEYSTORE_PASSWORD: ${{ secrets.HIKKI_KEYSTORE_PASSWORD }}
          HIKKI_KEY_ALIAS: ${{ secrets.HIKKI_KEY_ALIAS }}
          HIKKI_KEY_PASSWORD: ${{ secrets.HIKKI_KEY_PASSWORD }}
        working-directory: native/android
        run: |
          if [ -z "$HIKKI_KEYSTORE_BASE64" ]; then
            echo "::error::Permanent signing not configured."
            exit 1
          fi
          test -n "$HIKKI_KEYSTORE_PASSWORD"
          test -n "$HIKKI_KEY_ALIAS"
          test -n "$HIKKI_KEY_PASSWORD"
          mkdir -p "$HOME/.android"
          printf '%s' "$HIKKI_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/hikki-release.jks"
          chmod 600 "$HOME/.android/hikki-release.jks"
          keytool -list -keystore "$HOME/.android/hikki-release.jks" -storepass:env HIKKI_KEYSTORE_PASSWORD -alias "$HIKKI_KEY_ALIAS" > /dev/null
          cat >> app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              hikki {
                storeFile file(System.getProperty("user.home") + "/.android/hikki-release.jks")
                storePassword System.getenv("HIKKI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("HIKKI_KEY_ALIAS")
                keyPassword System.getenv("HIKKI_KEY_PASSWORD")
              }
            }
            buildTypes {
              debug { signingConfig signingConfigs.hikki }
            }
          }
          GRADLE
      - name: Build debug APK
        env:
          HIKKI_KEYSTORE_PASSWORD: ${{ secrets.HIKKI_KEYSTORE_PASSWORD }}
          HIKKI_KEY_ALIAS: ${{ secrets.HIKKI_KEY_ALIAS }}
          HIKKI_KEY_PASSWORD: ${{ secrets.HIKKI_KEY_PASSWORD }}
        working-directory: native/android
        run: bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hikki-Notes-Android-test
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
